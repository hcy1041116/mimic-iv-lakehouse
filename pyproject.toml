[project]
name = "mimic-iv-lakehouse"
version = "0.1.0"
description = "Lakehouse pipeline on MIMIC-IV demo hospital tables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
