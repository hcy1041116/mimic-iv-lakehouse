[project]
name = "mimic-iv-lakehouse"
version = "0.1.0"
description = "Lakehouse pipeline on MIMIC-IV demo hospital tables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebook：要先把 src/ 加進 sys.path 才能 import；display 是 Databricks 內建的
"notebooks/*" = ["E402", "F821"]
